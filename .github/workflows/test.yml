name: tests
on:
  push:
  pull_request:
jobs:
  workflow-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate workflows and CLI
        run: python -m unittest discover -s tests -v
